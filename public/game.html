<body>
<div id="app"></div>
<div class="topbar">
  <div class="brand">麻神<small>· 3D FREE MAHJONG</small></div>
  <div class="top-actions">
    <button id="shuffleBtn" title="申请开始下一局，需要四位玩家全部确认">下一局</button>
    <button id="mainViewBtn" title="恢复当前座位的默认视角">主视角</button>
    <button id="fullscreenBtn">全屏</button>
    <button id="leaveBtn">离开</button>
  </div>
</div>
<div class="status" id="status">连接中…</div>
<div class="round-status" id="roundStatus">对局数：1</div>
<div id="scoreboards"></div>
<div class="social-effects" id="socialEffects" aria-hidden="true"></div>
<div class="help">
  左键拾取/放下　<kbd>W</kbd> 翻面　<kbd>S</kbd> 复位　<kbd>右键</kbd> 撤销　<kbd>A</kbd>/<kbd>D</kbd> 旋转　中央方位标切换庄家 · 点击中央骰子槽掷骰子　左键拖动旋转视角　滚轮缩放
</div>
<div class="style-panel" id="stylePanel">
  <div class="style-title">视角风格</div>
  <label>背景明暗 <input id="backgroundBrightness" type="range" min="0.45" max="1.55" step="0.05" value="1"><span id="backgroundBrightnessValue">1.00</span></label>
  <label>牌桌颜色 <select id="tableColor"><option value="#176B45">经典绿</option><option value="#17617E">海军蓝</option><option value="#742D3C">酒红色</option><option value="#374B40">墨灰色</option><option value="#89633F">沙棕色</option></select></label>
  <label>牌桌明暗 <input id="tableBrightness" type="range" min="0.55" max="1.45" step="0.05" value="1"><span id="tableBrightnessValue">1.00</span></label>
  <label>牌背颜色 <select id="backColor"><option value="#1b6845">经典绿</option><option value="#244f91">宝石蓝</option><option value="#8a3038">绛红色</option><option value="#333b45">曜石灰</option><option value="#b08a43">鎏金色</option></select></label>
  <label>牌面明暗 <input id="faceBrightness" type="range" min="0.45" max="1.55" step="0.05" value="1"><span id="faceBrightnessValue">1.00</span></label>
</div>
<button class="ledger-toggle" id="ledgerToggle" aria-expanded="false">流水</button>
<section class="ledger-panel" id="ledgerPanel" hidden>
  <div class="ledger-heading"><strong>对局流水</strong><span>本局分数 / 累计总分</span></div>
  <div class="ledger-scroll" id="ledgerScroll"></div>
</section>
<div class="center-notice" id="centerNotice" aria-live="polite"></div>
<div class="dialog-overlay" id="dialogOverlay" hidden>
  <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="dialog-mark">麻</div>
    <h2 id="dialogTitle">请确认操作</h2>
    <p id="dialogMessage"></p>
    <div class="dialog-actions"><button id="dialogCancel" class="dialog-cancel">取消</button><button id="dialogConfirm" class="dialog-confirm">确认</button></div>
  </div>
</div>
<div class="dialog-overlay" id="scoreEditOverlay" hidden>
  <div class="dialog-card score-edit-card" role="dialog" aria-modal="true" aria-labelledby="scoreEditTitle">
    <div class="dialog-mark">分</div>
    <h2 id="scoreEditTitle">修改本局分数</h2>
    <p id="scoreEditCurrent"></p>
    <div class="score-mode-switch"><button type="button" data-score-mode="delta" class="active">增量修改</button><button type="button" data-score-mode="set">直接设定</button></div>
    <label class="score-input-row"><span id="scoreEditLabel">分数增量</span><input id="scoreEditInput" type="number" step="1" value="10" inputmode="numeric"></label>
    <p class="score-edit-preview" id="scoreEditPreview"></p>
    <div class="dialog-actions"><button id="scoreEditCancel" class="dialog-cancel">取消</button><button id="scoreEditConfirm" class="dialog-confirm">确认修改</button></div>
  </div>
</div>
