<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麻神 · 3D Free Mahjong</title>
<style>
:root{color-scheme:dark;--bg:#17120d;--panel:rgba(30,23,16,.88);--gold:#d7ad62;--text:#f4ead8;--muted:#a8977d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 25%,#403323 0,#211a13 48%,#100d09 100%);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",serif}
body{display:grid;place-items:center;padding:24px}.wrap{width:min(560px,94vw);text-align:center}.brand{font-size:48px;font-weight:900;letter-spacing:.22em;color:#e5c17d;text-shadow:0 4px 26px #d7ad6240}.sub{font:11px "Times New Roman",serif;letter-spacing:.42em;color:var(--muted);margin:8px 0 32px}
.card{padding:30px;background:var(--panel);border:1px solid #d7ad6240;border-radius:18px;box-shadow:0 24px 80px #0008;backdrop-filter:blur(16px)}.label{font-size:11px;letter-spacing:.28em;color:var(--gold);margin:4px 0 12px}
input{width:100%;padding:13px 16px;border:1px solid #d7ad6250;border-radius:9px;background:#ffffff09;color:var(--text);font:15px "Microsoft YaHei","PingFang SC",serif;text-align:center;outline:none}input:focus{border-color:var(--gold)}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.avatar-picker{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;margin-top:12px}.avatar-option{aspect-ratio:1;display:grid;place-items:center;border:1px solid #d7ad6238;border-radius:9px;background:#ffffff06;color:var(--text);font-size:25px;cursor:pointer;transition:.16s}.avatar-option:hover:not(:disabled){background:#d7ad6218;border-color:var(--gold);transform:translateY(-1px)}.avatar-option.selected{border-color:var(--gold);background:#d7ad6228;box-shadow:inset 0 0 0 1px #d7ad6250}.avatar-option.taken,.avatar-option:disabled{filter:grayscale(1);opacity:.24;cursor:not-allowed}.avatar-tip{font-size:10px;color:var(--muted);margin-top:7px}.seat{padding:17px 10px;border:1px solid #d7ad6238;border-radius:10px;cursor:pointer;background:#ffffff05;transition:.18s}.seat:hover:not(.taken){background:#d7ad6218;border-color:var(--gold)}.seat.selected{background:#d7ad6225;border-color:var(--gold);box-shadow:inset 0 0 0 1px #d7ad6250}.seat.taken{opacity:.38;cursor:not-allowed}.dir{font-size:23px;color:var(--gold);font-weight:800}.who{font-size:11px;color:var(--muted);margin-top:5px;min-height:16px}
button{font:inherit}.enter{width:100%;margin-top:20px;padding:14px;border:1px solid var(--gold);border-radius:9px;background:linear-gradient(180deg,#d7ad6240,#d7ad6215);color:#ffe7b4;letter-spacing:.28em;cursor:pointer}.enter:disabled{opacity:.35;cursor:not-allowed}.tip{font-size:11px;line-height:1.8;color:var(--muted);margin-top:16px}.status{margin-top:16px;font-size:11px;color:var(--muted)}
@media(max-width:480px){.brand{font-size:36px}.card{padding:22px}.avatar-picker{grid-template-columns:repeat(4,minmax(0,1fr))}.avatar-option{font-size:27px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">麻神</div>
  <div class="sub">· 3D FREE MAHJONG · FOUR PLAYERS</div>
  <div class="card">
    <div class="label">输入昵称</div>
    <input id="name" maxlength="12" placeholder="你的名字" autocomplete="off">
    <div class="label" style="margin-top:24px">选择座位</div>
    <div class="seats" id="seats"></div>
    <div class="label" style="margin-top:24px">选择头像</div>
    <div class="avatar-picker" id="avatars"></div>
    <div class="avatar-tip">已被其他玩家选择的头像会变灰，无法重复选择</div>
    <button class="enter" id="enter" disabled>进入 3D 牌桌</button>
    <div class="tip">四个浏览器窗口分别选择东、南、西、北。<br>所有玩家共享同一张牌桌，可以同时操作不同的牌。</div>
    <div class="status" id="status">正在连接本地牌桌服务器…</div>
  </div>
</div>
<script type="module" src="/src/lobby.js?v=20261127-4"></script>
</body>
</html>
